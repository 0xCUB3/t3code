<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <title>PDF viewer</title>
  </head>
  <body>
    <nav aria-label="PDF controls">
      <button id="previous" type="button" disabled>Previous</button>
      <label>Page <input id="page" type="number" min="1" value="1" disabled /></label>
      <span id="count"></span>
      <button id="next" type="button" disabled>Next</button>
      <button id="zoom-out" type="button" disabled aria-label="Zoom out">−</button>
      <button id="zoom-in" type="button" disabled aria-label="Zoom in">+</button>
      <a id="download" download>Download</a>
    </nav>
    <p id="status" role="status">Loading PDF…</p>
    <div id="viewer-container" tabindex="0" role="main" aria-label="PDF document">
      <div id="viewer" class="pdfViewer"></div>
    </div>
    <script type="module" src="/src/pdfViewer/main.ts"></script>
  </body>
</html>
